name: Prototype checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: buddy_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=app --cov=buddy --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql://buddy:ci-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/buddy_test
      - run: node --check static/app.js
