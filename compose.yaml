services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy-local-demo
      POSTGRES_DB: buddy
    volumes:
      - ./instance/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://buddy:buddy-local-demo@db:5432/buddy
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-luna}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./instance/web:/app/instance
    depends_on:
      db:
        condition: service_healthy
